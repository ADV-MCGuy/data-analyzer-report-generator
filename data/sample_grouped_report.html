
    <!DOCTYPE html>
    <html>
    <head>
        <title>Grouped Analysis Report</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 20px;
                background-color: #f5f5f5;
            }
            .container {
                background-color: white;
                padding: 20px;
                border-radius: 8px;
                max-width: 1000px;
                margin: 0 auto;
            }
            h1 {
                color: #333;
                border-bottom: 2px solid #28a745;
                padding-bottom: 10px;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                margin: 20px 0;
            }
            th, td {
                padding: 12px;
                text-align: left;
                border-bottom: 1px solid #ddd;
            }
            th {
                background-color: #28a745;
                color: white;
            }
            tr:hover {
                background-color: #f5f5f5;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>📊 Grouped Analysis: department</h1>
            <p>Analysis grouped by <strong>department</strong>, statistics for <strong>salary</strong></p>
            
            <table>
                <tr>
                    <th>Department</th>
                    <th>Count</th>
    
                    <th>Total salary</th>
                    <th>Average salary</th>
        
                </tr>
    
                <tr>
                    <td><strong>Engineering</strong></td>
                    <td>3</td>
        
                    <td>240000.00</td>
                    <td>80000.00</td>
            
                </tr>
        
                <tr>
                    <td><strong>Sales</strong></td>
                    <td>3</td>
        
                    <td>207000.00</td>
                    <td>69000.00</td>
            
                </tr>
        
                <tr>
                    <td><strong>Marketing</strong></td>
                    <td>2</td>
        
                    <td>146000.00</td>
                    <td>73000.00</td>
            
                </tr>
        
            </table>
        </div>
    </body>
    </html>
